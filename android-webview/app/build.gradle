plugins {
    id 'com.android.application'
}

android {
    namespace 'io.e2eechat.app'
    compileSdk 35

    defaultConfig {
        applicationId 'io.e2eechat.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
